[project]
name = "amaura"
version = "0.1.0"
description = "An evidence-first reliability layer for AI agents"
readme = "README.md"
authors = [
    { name = "Amaura Labs", email = "team@amauralabs.org" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
amaura = "amaura.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "S110",
    "SIM102",
    "PLW1510",
    "B008",
    "F841",
    "E501",
    "RUF012",
    "PYI063",
    "UP045",
]

